version: 2

models:
  - name: stg_ticket_purchases
    description: "Deduplicated ticket purchases from raw events"
    columns:
      - name: ticket_id
        description: "Unique identifier for each ticket"
        tests:
          - unique
          - not_null
      
      - name: price
        description: "Total amount paid"
        tests:
          - not_null
      
      - name: match_id
        description: "Foreign key to matches"
        tests:
          - not_null
          - relationships:
              to: ref('stg_matches')
              field: match_id